<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Asif - Digital Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- FUTURISTIC COSMIC DESIGN SYSTEM --- */
        :root {
            --bg-body: #03030a;
            --bg-card: rgba(12, 16, 32, 0.45);
            --bg-element: rgba(0, 240, 255, 0.08);
            --bg-element-hover: rgba(0, 240, 255, 0.22);
            --text-main: #ffffff;
            --text-muted: #a0b2ce;
            --border-color: rgba(0, 240, 255, 0.25);
            --border-glow: rgba(0, 240, 255, 0.8);
            --accent-cyan: #00f0ff;
            --accent-purple: #9d4edd;
            --accent-pink: #f72585;
            --btn-gradient: linear-gradient(135deg, #7209b7 0%, #00f0ff 100%);
            --shadow-neon: 0 0 45px rgba(0, 240, 255, 0.25);
            --modal-bg: rgba(10, 14, 28, 0.92);
        }

        [data-theme="light"] {
            --bg-body: #060814;
            --bg-card: rgba(18, 22, 48, 0.55);
            --text-main: #ffffff;
            --text-muted: #b0c2e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Fullscreen Galaxy Canvas */
        #galaxy-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Glassmorphic Cosmic Profile Container Card */
        .phone-wrapper {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            border-radius: 32px;
            border: 1px solid var(--border-color);
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-neon);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            animation: containerEntrance 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerEntrance {
            0% { opacity: 0; transform: translateY(35px) scale(0.92); }
            100% { opacity: 0.99; transform: translateY(0) scale(1); }
        }

        /* Header Navigation Tools */
        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        .lang-btn, .theme-btn {
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
            padding: 7px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(8px);
        }

        .lang-btn:hover, .theme-btn:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.5);
            transform: translateY(-2px);
        }

        .theme-btn {
            width: 36px;
            height: 36px;
            padding: 0;
            justify-content: center;
            border-radius: 50%;
        }

        /* Hero Avatar Section */
        .profile-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .avatar-frame {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 18px;
        }

        /* Rotating Cosmic Orbit Ring */
        .avatar-frame::before {
            content: '';
            position: absolute;
            top: -7px;
            left: -7px;
            right: -7px;
            bottom: -7px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink), var(--accent-cyan));
            animation: spinRing 4s linear infinite;
            z-index: 1;
            filter: blur(3px);
        }

        .avatar-frame::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: #090c1a;
            z-index: 1;
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        .avatar-frame img {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            z-index: 2;
        }

        .verified-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: var(--accent-cyan);
            color: #000;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 900;
            border: 2px solid #090c1a;
            z-index: 3;
            box-shadow: 0 0 12px var(--accent-cyan);
        }

        /* Name Typography with Gradient Glow */
        .profile-hero h1 {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffffff 20%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
        }

        .profile-title {
            font-size: 0.95rem;
            color: var(--accent-cyan);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        /* Quantum Status Indicator Pill */
        .status-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.35);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 14px;
            color: #ffffff;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }

        .status-dot.pulse {
            animation: pulseGlow 1.5s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .meta-info-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .meta-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .meta-item i {
            color: var(--accent-cyan);
        }

        /* Action Grid (4 Buttons) */
        .quick-actions-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .action-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            height: 72px;
            color: var(--text-main);
            text-decoration: none;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .action-pill::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(0, 240, 255, 0.15), transparent);
            transform: rotate(30deg);
            transition: 0.5s;
        }

        .action-pill:hover::after {
            left: 100%;
        }

        .action-pill:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
            transform: translateY(-4px);
            background: var(--bg-element-hover);
        }

        .action-pill i {
            font-size: 1.25rem;
            margin-bottom: 6px;
            color: var(--accent-cyan);
        }

        .action-pill span {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Action CTAs */
        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary-neon {
            width: 100%;
            height: 52px;
            background: var(--btn-gradient);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
            letter-spacing: 0.5px;
        }

        .btn-primary-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.7);
            filter: brightness(1.1);
        }

        .btn-outline-cyber {
            width: 100%;
            height: 52px;
            background: rgba(0, 240, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .btn-outline-cyber:hover {
            border-color: var(--accent-cyan);
            background: var(--bg-element-hover);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 8, 0.88);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.visible { opacity: 1; pointer-events: auto; }

        .vcard-popup-reminder {
            width: 90%;
            max-width: 340px;
            background: var(--modal-bg);
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.35);
            border-radius: 28px;
            padding: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.visible .vcard-popup-reminder { transform: scale(1); }

        .vcard-popup-icon {
            width: 60px;
            height: 60px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent-cyan);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            margin-bottom: 16px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .vcard-popup-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
            font-weight: 500;
            margin-bottom: 24px;
        }

        .modal-btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .vcard-popup-btn {
            background: var(--btn-gradient);
            color: #ffffff;
            border: none;
            width: 100%;
            height: 46px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.35);
        }

        .vcard-popup-close-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            width: 100%;
            height: 40px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .vcard-popup-close-btn:hover { color: var(--text-main); }

        @media (max-width: 480px) {
            body { padding: 0; background: transparent; }
            .phone-wrapper { border-radius: 0; border: none; min-height: 100vh; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Fullscreen Deep Space Galaxy Canvas -->
    <canvas id="galaxy-canvas"></canvas>

    <div class="phone-wrapper">
        
        <div class="controls-header">
            <button id="lang-toggle" class="lang-btn" aria-label="Switch Language">
                <i class="fa-solid fa-globe"></i> <span id="lang-text">عربي</span>
            </button>
            <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
        
        <section class="profile-hero">
            <div class="avatar-frame">
                <img id="profile-display-img" src="Screenshot_20260526_003701_WhatsApp.jpg" alt="Muhammad Asif">
                <div class="verified-badge"><i class="fa-solid fa-check"></i></div>
            </div>
            
            <div id="status-badge" class="status-container">
                <span id="status-dot" class="status-dot pulse"></span>
                <span id="status-text">Checking Status...</span>
            </div>

            <h1 id="profile-name">Muhammad Asif</h1>
            <p id="profile-title" class="profile-title">Business Operations Executive</p>
            
            <div class="meta-info-list">
                <div class="meta-item"><i class="fa-solid fa-location-dot"></i> <span id="meta-location">Doha, Qatar</span></div>
            </div>
        </section>

        <!-- Quick Actions Row -->
        <section class="quick-actions-row">
            <a href="tel:+97451736746" class="action-pill interaction-track" data-label="Phone Call Clicked">
                <i class="fa-solid fa-phone"></i>
                <span data-i18n="call">Call</span>
            </a>
            <a href="https://wa.me/97451736746" target="_blank" class="action-pill interaction-track" data-label="WhatsApp Clicked">
                <i class="fa-brands fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>
            <a href="https://wa.me/97451736746?text=Hey%20can%20we%20schedule%20a%20meeting" target="_blank" class="action-pill interaction-track" data-label="Meeting WhatsApp Clicked">
                <i class="fa-regular fa-calendar-days"></i>
                <span data-i18n="meeting">Meeting</span>
            </a>
            <a href="#" target="_blank" class="action-pill interaction-track" data-label="Office Location Mapped">
                <i class="fa-solid fa-location-arrow"></i>

            </a>
        </section>

        <section class="cta-container">
            <button id="share-profile-btn" class="btn-primary-neon">
                <i class="fa-solid fa-share-nodes"></i> <span data-i18n="btn-share">Share Profile</span>
            </button>
            <button id="vcard-btn" class="btn-outline-cyber">
                <i class="fa-regular fa-address-card"></i> <span id="vcard-btn-text" data-i18n="btn-vcard">Download vCard</span>
            </button>
        </section>

    </div>

    <!-- Contact Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="vcard-popup-reminder">
            <div class="vcard-popup-icon"><i class="fa-solid fa-user-plus"></i></div>
            <div id="vcard-reminder-text" class="vcard-popup-text">
                Save Muhammad Asif directly to your phone contacts list.
            </div>
            <div class="modal-btn-group">
                <button id="vcard-popup-download" class="vcard-popup-btn">Save Contact</button>
                <button id="vcard-popup-close" class="vcard-popup-close-btn">Not Now</button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           1. DEEP SPACE GALAXY & SHOOTING STARS CANVAS ENGINE
           ========================================================================== */
        const canvas = document.getElementById('galaxy-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let meteors = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.4 + 0.6;
                this.alpha = Math.random();
                this.alphaChange = (Math.random() * 0.02 + 0.005) * (Math.random() < 0.5 ? 1 : -1);
                this.color = ['#ffffff', '#00f0ff', '#e0aaff', '#f72585'][Math.floor(Math.random() * 4)];
            }
            update() {
                this.alpha += this.alphaChange;
                if (this.alpha <= 0.15 || this.alpha >= 1) {
                    this.alphaChange *= -1;
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0.15, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = this.size * 6;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Meteor {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width * 1.5 - canvas.width * 0.25;
                this.y = -50;
                this.length = Math.random() * 120 + 60;
                this.speed = Math.random() * 9 + 5;
                this.size = Math.random() * 1.8 + 0.8;
            }
            update() {
                this.x += this.speed;
                this.y += this.speed * 0.8;
                if (this.y > canvas.height + 100 || this.x > canvas.width + 100) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                const gradient = ctx.createLinearGradient(
                    this.x, this.y, 
                    this.x - this.length, this.y - this.length * 0.8
                );
                gradient.addColorStop(0, '#00f0ff');
                gradient.addColorStop(0.5, '#f72585');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.strokeStyle = gradient;
                ctx.lineWidth = this.size;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.length, this.y -
