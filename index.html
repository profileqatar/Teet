<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Asif - Digital Futuristic Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Futuristic Violet & Quantum Neon Theme */
            --bg-deep: #08031a;
            --bg-gradient-1: #0e0529;
            --bg-gradient-2: #190942;
            --bg-card: rgba(18, 10, 48, 0.72);
            --bg-element: rgba(0, 240, 255, 0.08);
            --bg-element-hover: rgba(0, 240, 255, 0.22);
            
            --text-main: #ffffff;
            --text-muted: #a4b3e6;
            
            --border-glow: rgba(0, 240, 255, 0.35);
            --border-purple: rgba(177, 61, 255, 0.4);
            
            --neon-cyan: #00f0ff;
            --neon-blue: #3b82f6;
            --neon-purple: #b13dff;
            --neon-magenta: #f72585;
            
            --btn-gradient: linear-gradient(135deg, #8013ff 0%, #00f0ff 100%);
            --shadow-orb: 0 0 45px rgba(0, 240, 255, 0.25), 0 0 90px rgba(177, 61, 255, 0.2);
        }

        [data-theme="light"] {
            --bg-deep: #0b0726;
            --bg-gradient-1: #150d3d;
            --bg-gradient-2: #221257;
            --bg-card: rgba(26, 16, 64, 0.82);
            --text-main: #ffffff;
            --text-muted: #b8c7f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }

        body {
            background: radial-gradient(circle at 50% 30%, var(--bg-gradient-2) 0%, var(--bg-gradient-1) 50%, var(--bg-deep) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Fullscreen Holographic Interactive Particle Canvas */
        #orb-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Glassmorphic Cyber Card Wrapper */
        .phone-wrapper {
            width: 100%;
            max-width: 410px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            border: 1px solid var(--border-glow);
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-orb);
            position: relative;
            z-index: 2;
            animation: containerEntrance 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Outer Cyber Frame Glow Corner Highlights */
        .phone-wrapper::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 33px;
            padding: 1px;
            background: linear-gradient(135deg, var(--neon-cyan), transparent 40%, var(--neon-purple), transparent 80%, var(--neon-cyan));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        @keyframes containerEntrance {
            0% { opacity: 0; transform: translateY(40px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Navigation & Controls Header */
        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        .lang-btn, .theme-btn {
            background: var(--bg-element);
            border: 1px solid var(--border-glow);
            color: var(--neon-cyan);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 7px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }

        .lang-btn:hover, .theme-btn:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 22px rgba(0, 240, 255, 0.45);
            transform: translateY(-2px);
        }

        .theme-btn {
            width: 38px;
            height: 38px;
            padding: 0;
            justify-content: center;
            border-radius: 50%;
        }

        /* Hero Avatar Section */
        .profile-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
            position: relative;
        }

        .avatar-frame {
            position: relative;
            width: 114px;
            height: 114px;
            margin-bottom: 18px;
        }

        /* Pulsing Holographic Ring Around Avatar */
        .avatar-frame::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--neon-cyan), var(--neon-purple), var(--neon-magenta), var(--neon-cyan));
            animation: spinRing 5s linear infinite;
            z-index: 1;
            filter: blur(4px);
        }

        .avatar-frame::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: #0f0826;
            z-index: 1;
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        .avatar-frame img {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            z-index: 2;
        }

        .verified-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: var(--neon-cyan);
            color: #08031a;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 900;
            border: 2px solid #08031a;
            z-index: 3;
            box-shadow: 0 0 14px var(--neon-cyan);
        }

        /* Futuristic Name Styling */
        .profile-hero h1 {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 20%, var(--neon-cyan) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 28px rgba(0, 240, 255, 0.4);
        }

        /* Quantum Status Pillar */
        .status-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.35);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 14px;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.2);
            letter-spacing: 0.3px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #00ffcc;
            box-shadow: 0 0 12px #00ffcc;
        }

        .status-dot.pulse {
            animation: pulseGlow 1.5s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .meta-info-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .meta-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .meta-item i {
            color: var(--neon-cyan);
        }

        /* Quick Action Matrix (4 Hex-inspired Buttons) */
        .quick-actions-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .action-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-element);
            border: 1px solid var(--border-glow);
            border-radius: 18px;
            height: 74px;
            color: var(--text-main);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .action-pill::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(0, 240, 255, 0.25), transparent);
            transform: rotate(30deg);
            transition: 0.5s;
        }

        .action-pill:hover::after {
            left: 100%;
        }

        .action-pill:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 24px rgba(0, 240, 255, 0.45);
            transform: translateY(-4px);
            background: var(--bg-element-hover);
        }

        .action-pill i {
            font-size: 1.3rem;
            margin-bottom: 6px;
            color: var(--neon-cyan);
        }

        .action-pill span {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Action CTAs */
        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary-neon {
            width: 100%;
            height: 54px;
            background: var(--btn-gradient);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.45);
            letter-spacing: 0.5px;
        }

        .btn-primary-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 42px rgba(0, 240, 255, 0.8);
            filter: brightness(1.15);
        }

        .btn-outline-cyber {
            width: 100%;
            height: 54px;
            background: rgba(0, 240, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .btn-outline-cyber:hover {
            border-color: var(--neon-cyan);
            background: var(--bg-element-hover);
            box-shadow: 0 0 26px rgba(0, 240, 255, 0.4);
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 2, 14, 0.88);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.visible { opacity: 1; pointer-events: auto; }

        .vcard-popup-reminder {
            width: 90%;
            max-width: 340px;
            background: rgba(20, 10, 50, 0.95);
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.4);
            border-radius: 28px;
            padding: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.visible .vcard-popup-reminder { transform: scale(1); }

        .vcard-popup-icon {
            width: 60px;
            height: 60px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--neon-cyan);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            margin-bottom: 16px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .vcard-popup-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
            font-weight: 500;
            margin-bottom: 24px;
        }

        .modal-btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .vcard-popup-btn {
            background: var(--btn-gradient);
            color: #ffffff;
            border: none;
            width: 100%;
            height: 46px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.35);
        }

        .vcard-popup-close-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            width: 100%;
            height: 40px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .vcard-popup-close-btn:hover { color: var(--text-main); }

        @media (max-width: 480px) {
            body { padding: 0; }
            .phone-wrapper { border-radius: 0; border: none; min-height: 100vh; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Fullscreen Holographic Particle Orb Canvas -->
    <canvas id="orb-canvas"></canvas>

    <div class="phone-wrapper">
        
        <div class="controls-header">
            <button id="lang-toggle" class="lang-btn" aria-label="Switch Language">
                <i class="fa-solid fa-globe"></i> <span id="lang-text">عربي</span>
            </button>
            <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
        
        <section class="profile-hero">
            <div class="avatar-frame">
                <img id="profile-display-img" src="Screenshot_20260526_003701_WhatsApp.jpg" alt="Muhammad Asif">
                <div class="verified-badge"><i class="fa-solid fa-check"></i></div>
            </div>
            
            <div id="status-badge" class="status-container">
                <span id="status-dot" class="status-dot pulse"></span>
                <span id="status-text">Checking Status...</span>
            </div>

            <h1 id="profile-name">Muhammad Asif</h1>
            
            <div class="meta-info-list">
                <div class="meta-item"><i class="fa-solid fa-location-dot"></i> <span id="meta-location">Doha, Qatar</span></div>
            </div>
        </section>

        <!-- Quick Actions Row -->
        <section class="quick-actions-row">
            <a href="tel:+97451736746" class="action-pill interaction-track" data-label="Phone Call Clicked">
                <i class="fa-solid fa-phone"></i>
                <span data-i18n="call">Call</span>
            </a>
            <a href="https://wa.me/97451736746" target="_blank" class="action-pill interaction-track" data-label="WhatsApp Clicked">
                <i class="fa-brands fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>
            <a href="https://wa.me/97451736746?text=Hey%20can%20we%20schedule%20a%20meeting" target="_blank" class="action-pill interaction-track" data-label="Meeting WhatsApp Clicked">
                <i class="fa-regular fa-calendar-days"></i>
                <span data-i18n="meeting">Meeting</span>
            </a>
            <a href="#" target="_blank" class="action-pill interaction-track" data-label="Office Location Mapped">
                <i class="fa-solid fa-location-arrow"></i>
                <span data-i18n="location_pill">Location</span>
            </a>
        </section>

        <section class="cta-container">
            <button id="share-profile-btn" class="btn-primary-neon">
                <i class="fa-solid fa-share-nodes"></i> <span data-i18n="btn-share">Share Profile</span>
            </button>
            <button id="vcard-btn" class="btn-outline-cyber">
                <i class="fa-regular fa-address-card"></i> <span id="vcard-btn-text" data-i18n="btn-vcard">Download vCard</span>
            </button>
        </section>

    </div>

    <!-- Contact Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="vcard-popup-reminder">
            <div class="vcard-popup-icon"><i class="fa-solid fa-user-plus"></i></div>
            <div id="vcard-reminder-text" class="vcard-popup-text">
                Save Muhammad Asif directly to your phone contacts list.
            </div>
            <div class="modal-btn-group">
                <button id="vcard-popup-download" class="vcard-popup-btn">Save Contact</button>
                <button id="vcard-popup-close" class="vcard-popup-close-btn">Not Now</button>
            </div>
        </div>
    </div>

    <script>
        // Interactive 3D Holographic Orb Sphere Particle Engine
        const canvas = document.getElementById('orb-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Orb particle system variables
        const numParticles = 420;
        const sphereRadius = Math.min(window.innerWidth, window.innerHeight) * 0.32;
        const particles = [];
        let rotationX = 0;
        let rotationY = 0;

        // Create 3D points distributed on sphere surface using Fibonacci Spiral
        const phi = Math.PI * (3 - Math.sqrt(5)); // Golden ratio angle
        for (let i = 0; i < numParticles; i++) {
            const y = 1 - (i / (numParticles - 1)) * 2; // y goes from 1 to -1
            const radiusAtY = Math.sqrt(1 - y * y);
            const theta = phi * i;

            const x = Math.cos(theta) * radiusAtY;
            const z = Math.sin(theta) * radiusAtY;

            particles.push({
                x: x * sphereRadius,
                y: y * sphereRadius,
                z: z * sphereRadius,
                baseX: x * sphereRadius,
                baseY: y * sphereRadius,
                baseZ: z * sphereRadius,
                pulse: Math.random() * Math.PI * 2,
                size: Math.random() * 2 + 1,
                color: ['#00f0ff', '#3b82f6', '#b13dff', '#e0aaff'][Math.floor(Math.random() * 4)]
            });
        }

        // Particle connections/waves
        let waveTime = 0;

        function renderOrb() {
            ctx.clearRect(0, 0, width, height);
            waveTime += 0.02;

            // Subtle rotation movement
            rotationY += 0.005;
            rotationX += 0.002;

            const centerX = width / 2;
            const centerY = height / 2 - 20;

            const cosY = Math.cos(rotationY);
            const sinY = Math.sin(rotationY);
            const cosX = Math.cos(rotationX);
            const sinX = Math.sin(rotationX);

            // Projected 2D points storage for drawing futuristic connection lines
            const projectedPoints = [];

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];

                // Wave distortion effect inspired by Pythia glowing orb
                const wave = Math.sin(p.pulse + waveTime) * 12;
                const radiusFactor = 1 + Math.sin(p.y * 0.01 + waveTime * 1.5) * 0.08;

                let x = p.baseX * radiusFactor;
                let y = p.baseY * radiusFactor + wave;
                let z = p.baseZ * radiusFactor;

                // 3D Rotation around Y axis
                let x1 = x * cosY - z * sinY;
                let z1 = z * cosY + x * sinY;

                // 3D Rotation around X axis
                let y1 = y * cosX - z1 * sinX;
                let z2 = z1 * cosX + y * sinX;

                // Perspective projection
                const perspective = 600;
                const scale = perspective / (perspective + z2 + sphereRadius);
                const projX = centerX + x1 * scale;
                const projY = centerY + y1 * scale;

                const alpha = Math.max(0.1, (z2 + sphereRadius) / (sphereRadius * 2));

                projectedPoints.push({ x: projX, y: projY, z: z2, scale, alpha, color: p.color, size: p.size });
            }

            // Draw futuristic energy connections between near points
            ctx.lineWidth = 0.5;
            for (let i = 0; i < projectedPoints.length; i += 3) {
                for (let j = i + 1; j < projectedPoints.length; j += 4) {
                    const p1 = projectedPoints[i];
                    const p2 = projectedPoints[j];

                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 55) {
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(0, 240, 255, ${0.18 * (1 - dist / 55) * p1.alpha})`;
                        ctx.stroke();
                    }
                }
            }

            // Draw particle nodes
            for (let i = 0; i < projectedPoints.length; i++) {
                const p = projectedPoints[i];
                ctx.save();
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.scale, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.shadowBlur = 12 * p.scale;
                ctx.shadowColor = p.color;
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(renderOrb);
        }

        renderOrb();

        // Mouse interaction to subtly rotate orb
        window.addEventListener('mousemove', (e) => {
            const mouseX = (e.clientX - width / 2) / width;
            const mouseY = (e.clientY - height / 2) / height;
            rotationY += mouseX * 0.02;
            rotationX += mouseY * 0.02;
        });

        let currentLanguage = 'en';
        const translations = {
            en: {
                name: "Muhammad Asif",
                location: "Doha, Qatar",
                call: "Call",
                meeting: "Meeting",
                location_pill: "Location",
                "btn-share": "Share Profile",
                "btn-vcard": "Download vCard",
                "vcard_reminder": "Save Muhammad Asif directly to your phone contacts list.",
                "vcard_save": "Save Contact",
                "vcard_cancel": "Not Now",
                "copied": "Link Copied!",
                "status-on": "Active Now (Qatar Time)",
                "status-off": "🌙 Standby / Offline"
            },
            ar: {
                name: "محمد آصف",
                location: "الدوحة، قطر",
                call: "اتصال",
                meeting: "اجتماع",
                location_pill: "الموقع",
                "btn-share": "مشاركة الملف",
                "btn-vcard": "حفظ جهة الاتصال",
                "vcard_reminder": "احفظ جهة اتصال محمد آصف مباشرة في هاتفك.",
                "vcard_save": "حفظ جهة الاتصال",
                "vcard_cancel": "ليس الآن",
                "copied": "تم نسخ الرابط!",
                "status-on": "نشط حالياً (توقيت قطر)",
                "status-off": "🌙 خارج أوقات العمل"
            }
        };

        const langToggleBtn = document.getElementById('lang-toggle');
        const langText = document.getElementById('lang-text');

        function setLanguage(lang) {
            currentLanguage = lang;
            document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.documentElement.setAttribute('lang', lang);
            langText.innerText = lang === 'en' ? 'عربي' : 'EN';

            document.getElementById('profile-name').innerText = translations[lang].name;
            document.getElementById('meta-location').innerText = translations[lang].location;
            document.getElementById('vcard-reminder-text').innerText = translations[lang]["vcard_reminder"];
            document.getElementById('vcard-popup-download').innerText = translations[lang]["vcard_save"];
            document.getElementById('vcard-popup-close').innerText = translations[lang]["vcard_cancel"];

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const translationKey = element.getAttribute('data-i18n');
                if (translations[lang][translationKey]) {
                    const icon = element.querySelector('i');
                    if (icon) {
                        element.innerHTML = '';
                        element.appendChild(icon);
                        element.appendChild(document.createTextNode(' ' + translations[lang][translationKey]));
                    } else {
                        element.innerText = translations[lang][translationKey];
                    }
                }
            });
            updateQatarStatus(); 
        }

        langToggleBtn.addEventListener('click', () => {
            setLanguage(currentLanguage === 'en' ? 'ar' : 'en');
        });

        function updateQatarStatus() {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            const now = new Date();
            const qatarTimeString = now.toLocaleString("en-US", {timeZone: "Asia/Qatar", hour: 'numeric', hour12: false});
            const currentQatarHour = parseInt(qatarTimeString, 10);

            if (currentQatarHour >= 8 && currentQatarHour < 18) {
                dot.style.backgroundColor = "#00ffcc";
                dot.classList.add('pulse');
                text.innerText = translations[currentLanguage]["status-on"];
            } else {
                dot.style.backgroundColor = "#f72585";
                dot.classList.remove('pulse');
                text.innerText = translations[currentLanguage]["status-off"];
            }
        }
        updateQatarStatus();
        setInterval(updateQatarStatus, 60000);

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = themeToggleBtn.querySelector('i');

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            let targetTheme = 'dark';
            if (currentTheme === 'dark') {
                targetTheme = 'light';
                themeIcon.className = 'fa-solid fa-sun';
            } else {
                themeIcon.className = 'fa-solid fa-moon';
            }
            document.documentElement.setAttribute('data-theme', targetTheme);
        });

        const modalOverlay = document.getElementById('modal-overlay');
        const closePopupBtn = document.getElementById('vcard-popup-close');
        let hasVcardBeenDownloaded = false;
        
        setTimeout(() => {
            if (!hasVcardBeenDownloaded) {
                modalOverlay.classList.add('visible');
            }
        }, 15000);

        closePopupBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('visible');
        });

        document.getElementById('vcard-popup-download').addEventListener('click', () => {
            modalOverlay.classList.remove('visible');
            document.getElementById('vcard-btn').click(); 
        });

        const shareBtn = document.getElementById('share-profile-btn');
        shareBtn.addEventListener('click', async () => {
            const shareData = {
                title: "Muhammad Asif",
                text: "Muhammad Asif - Contact Profile",
                url: window.location.href
            };

            if (navigator.share) {
                try { await navigator.share(shareData); } catch (err) {}
            } else {
                try {
                    await navigator.clipboard.writeText(window.location.href);
                    const originalText = shareBtn.innerHTML;
                    shareBtn.innerHTML = `<i class="fa-solid fa-check"></i> ${translations[currentLanguage].copied}`;
                    setTimeout(() => { shareBtn.innerHTML = originalText; }, 2500);
                } catch (err) { alert('URL copied to clipboard.'); }
            }
        });

        async function triggerVcardDownload() {
            hasVcardBeenDownloaded = true;
            modalOverlay.classList.remove('visible'); 
            
            const imageUrl = window.location.origin + window.location.pathname.replace('index.html', '') + 'Screenshot_20260526_003701_WhatsApp.jpg';
            let base64PhotoText = '';
            
            try {
                const response = await fetch(imageUrl);
                const blob = await response.blob();
                base64PhotoText = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(blob);
                });
            } catch (e) {}

            const vcardLines = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                "N:Asif;Muhammad;;;",
                "FN:Muhammad Asif",
                "TEL;TYPE=CELL;TYPE=PREF:+97451736746"
            ];
            
            if (base64PhotoText) {
                vcardLines.push("PHOTO;TYPE=JPEG;ENCODING=b:" + base64PhotoText);
            } else {
                vcardLines.push("PHOTO;VALUE=URL:" + imageUrl);
            }
            vcardLines.push("END:VCARD");

            const blobFile = new Blob([vcardLines.join("\r\n")], { type: 'text/vcard;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blobFile);
            link.download = 'Muhammad_Asif.vcf';
            link.click();
        }

        document.getElementById('vcard-btn').addEventListener('click', triggerVcardDownload);
    </script>
</body>
</html>
