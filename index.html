<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Asif - Quantum Digital Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- FUTURISTIC CYBER-THEME DESIGN VARIABLES --- */
        :root {
            --bg-body: #030408;
            --bg-card: #080b13;
            --bg-element: rgba(18, 24, 38, 0.7);
            --bg-element-hover: rgba(28, 38, 59, 0.9);
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --border-color: rgba(0, 243, 255, 0.15);
            --border-hover: rgba(0, 243, 255, 0.5);
            --accent-cyan: #00f3ff;
            --accent-violet: #bd00ff;
            --btn-primary: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%);
            --btn-hover-shadow: rgba(0, 243, 255, 0.4);
            --shadow-wrapper: 0 0 50px rgba(0, 243, 255, 0.08), 0 20px 40px rgba(0, 0, 0, 0.9);
            --overlay-bg: rgba(3, 4, 8, 0.85);
            --modal-bg: #0b0f19;
        }

        [data-theme="light"] {
            --bg-body: #e8ecf2;
            --bg-card: #ffffff;
            --bg-element: rgba(240, 244, 250, 0.8);
            --bg-element-hover: rgba(225, 232, 244, 1);
            --text-main: #0b0f19;
            --text-muted: #57657b;
            --border-color: rgba(0, 102, 255, 0.2);
            --border-hover: rgba(0, 102, 255, 0.5);
            --accent-cyan: #0066ff;
            --accent-violet: #8800cc;
            --btn-primary: linear-gradient(135deg, #0066ff 0%, #00d2ff 100%);
            --btn-hover-shadow: rgba(0, 102, 255, 0.3);
            --shadow-wrapper: 0 20px 40px rgba(0, 0, 0, 0.1);
            --overlay-bg: rgba(0, 0, 0, 0.5);
            --modal-bg: #ffffff;
        }

        /* Global Reset & Futuristic Backdrop */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(189, 0, 255, 0.05) 0%, transparent 40%);
        }

        /* Responsive Holographic Mobile Container */
        .phone-wrapper {
            width: 100%;
            max-width: 412px;
            background-color: var(--bg-card);
            border-radius: 36px;
            border: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-wrapper);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }

        /* Controls Header (Theme & Language) */
        .controls-header {
            position: absolute;
            top: 20px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .lang-btn {
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .lang-btn:hover { border-color: var(--accent-cyan); background: var(--bg-element-hover); }

        .theme-btn {
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.95rem;
        }
        .theme-btn:hover { border-color: var(--accent-cyan); background: var(--bg-element-hover); }

        /* Futuristic Hero Section */
        .profile-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: -24px -24px 25px -24px;
            padding: 55px 24px 20px 24px;
            position: relative;
            background: linear-gradient(to bottom, rgba(8, 11, 19, 0.2) 0%, var(--bg-card) 95%), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80&w=600') no-repeat top center;
            background-size: cover;
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: 16px;
            z-index: 2;
        }

        /* Glowing Cyberpunk Gold/Cyan Ring */
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--accent-cyan);
            animation: cyberGlowPulse 3s infinite ease-in-out;
        }

        @keyframes cyberGlowPulse {
            0% { box-shadow: 0 0 10px rgba(0, 243, 255, 0.3), inset 0 0 10px rgba(0, 243, 255, 0.2); }
            50% { box-shadow: 0 0 25px rgba(0, 243, 255, 0.8), 0 0 40px rgba(189, 0, 255, 0.4); }
            100% { box-shadow: 0 0 10px rgba(0, 243, 255, 0.3), inset 0 0 10px rgba(0, 243, 255, 0.2); }
        }

        .verified-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background-color: var(--accent-cyan);
            color: #030408;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            font-weight: 900;
            border: 2px solid var(--bg-card);
            z-index: 3;
        }
        [dir="rtl"] .verified-badge { right: auto; left: 2px; }

        .profile-hero h1 {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
            z-index: 2;
            background: linear-gradient(135deg, var(--text-main) 30%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Quantum Status Indicator */
        .status-container {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            margin-bottom: 14px;
            z-index: 2;
            color: var(--text-main);
            backdrop-filter: blur(10px);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #00ffcc;
        }

        .status-dot.pulse {
            animation: statusPulse 1.8s infinite ease-in-out;
        }

        @keyframes statusPulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.8); }
            70% { box-shadow: 0 0 0 8px rgba(0, 255, 204, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); }
        }

        .profile-title {
            font-size: 0.95rem;
            color: var(--accent-cyan);
            font-weight: 600;
            margin-bottom: 14px;
            z-index: 2;
            letter-spacing: 0.5px;
        }

        .meta-info-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
            z-index: 2;
        }

        .meta-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .meta-item i {
            color: var(--accent-cyan);
            font-size: 0.9rem;
        }

        /* Quick Action Glass Grid */
        .quick-actions-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 25px;
        }

        .action-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            height: 64px;
            color: var(--text-main);
            text-decoration: none;
            backdrop-filter: blur(10px);
        }
        .action-pill:hover { border-color: var(--accent-cyan); background: var(--bg-element-hover); transform: translateY(-2px); }

        .action-pill i {
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: var(--accent-cyan);
        }

        .action-pill span {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Section Titles */
        .section-heading {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            font-weight: 700;
            margin-bottom: 14px;
            padding-left: 2px;
        }
        [dir="rtl"] .section-heading { padding-left: 0; padding-right: 2px; letter-spacing: 0; }

        /* Services Navigation List */
        .link-list-group {
            display: flex;
            flex-direction: column;
            background: var(--bg-element);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }
        [dir="rtl"] .list-item { text-align: right; }
        .list-item:last-of-type { border-bottom: none; }
        .list-item:hover { background: var(--bg-element-hover); }

        .list-item-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .list-item-left i {
            font-size: 1.05rem;
            color: var(--accent-cyan);
            width: 20px;
            text-align: center;
        }

        .list-item .fa-chevron-right {
            font-size: 0.75rem;
            color: var(--text-muted);
            transition: transform 0.3s ease;
        }
        [dir="rtl"] .list-item .fa-chevron-right { transform: rotate(180deg); }
        .list-item.active .fa-chevron-right { transform: rotate(90deg) !important; color: var(--accent-cyan); }

        /* Services Dropdown Panel */
        .services-dropdown-panel {
            max-height: 0;
            overflow: hidden;
            background: rgba(11, 15, 25, 0.5);
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid var(--border-color);
        }

        .services-panel-content {
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .service-tag-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: var(--text-main);
        }
        .service-tag-item:hover { border-color: var(--accent-cyan); }

        .service-tag-item i {
            color: var(--accent-cyan);
            font-size: 0.95rem;
            width: 16px;
            text-align: center;
        }

        /* Action CTAs */
        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .btn-primary-glow {
            width: 100%;
            height: 50px;
            background: var(--btn-primary);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--btn-hover-shadow);
        }
        .btn-primary-glow:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .btn-outline-cyber {
            width: 100%;
            height: 50px;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .btn-outline-cyber:hover { border-color: var(--accent-cyan); background: var(--bg-element-hover); }

        /* Holographic Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.visible { opacity: 1; pointer-events: auto; }

        .vcard-popup-reminder {
            width: 90%;
            max-width: 340px;
            background: var(--modal-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 60px rgba(0, 243, 255, 0.15);
            border-radius: 28px;
            padding: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.visible .vcard-popup-reminder { transform: scale(1); }

        .vcard-popup-icon {
            width: 56px;
            height: 56px;
            background: rgba(0, 243, 255, 0.1);
            color: var(--accent-cyan);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .vcard-popup-text {
            font-size: 0.92rem;
            line-height: 1.5;
            color: var(--text-main);
            font-weight: 500;
            margin-bottom: 24px;
        }

        .modal-btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .vcard-popup-btn {
            background: var(--btn-primary);
            color: #ffffff;
            border: none;
            width: 100%;
            height: 46px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
        }

        .vcard-popup-close-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            width: 100%;
            height: 40px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
        }
        .vcard-popup-close-btn:hover { color: var(--text-main); }

        @media (max-width: 480px) {
            body { padding: 0; background-color: var(--bg-card); }
            .phone-wrapper { border-radius: 0; border: none; min-height: 100vh; box-shadow: none; }
            .profile-hero { margin: -50px -20px 25px -20px; padding: 65px 20px 20px 20px; }
        }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        
        <div class="controls-header">

                <i class="fa-solid fa-moon"></i>

            <div id="status-badge" class="status-container">

        <h2 id="heading-services" class="section-heading">Services & Operations</h2>
        <nav class="link-list-group">
            <button id="services-trigger" class="list-item interaction-track" data-label="Services Panel Expanded">
                <div class="list-item-left"><i class="fa-solid fa-network-wired"></i> <span data-i18n="services">Core Capabilities</span></div>

            <div id="services-panel" class="services-dropdown-panel">

    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="vcard-popup-reminder">
            <div class="vcard-popup-icon"><i class="fa-regular fa-address-book"></i></div>
            <div id="vcard-reminder-text" class="vcard-popup-text">
                Connect instantly. Save Muhammad Asif directly to your contacts list.
            </div>
            <div class="modal-btn-group">
                <button id="vcard-popup-download" class="vcard-popup-btn">Save Contact</button>
                <button id="vcard-popup-close" class="vcard-popup-close-btn">Not Now</button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           1. TRANSLATION DICTIONARY MAP & LANGUAGE SWITCHER
           ========================================================================== */
        let currentLanguage = 'en';
        
        const translations = {
            en: {
                name: "Muhammad Asif",
                title: "Business Operations Executive",
                location: "Doha, Qatar",
                services_heading: "Services & Operations",
                services: "Core Capabilities",
                call: "Call",
                email: "Email",
                meeting: "Meeting",
                location_pill: "Location",
                "svc-consultation": "Consultation",
                "svc-solutions": "Business Solutions",
                "svc-operations": "Operations Services",
                "btn-share": "Share Profile",
                "btn-vcard": "Download vCard",
                "vcard_reminder": "Connect instantly. Save Muhammad Asif directly to your contacts list.",
                "vcard_save": "Save Contact",
                "vcard_cancel": "Not Now",
                "copied": "Link Copied!",
                "status-on": "Quantum Active (Qatar Time)",
                "status-off": "🌙 Offline / Standby"
            },
            ar: {
                name: "محمد آصف",
                title: "تنفيذي عمليات تجارية",
                location: "الدوحة، قطر",
                services_heading: "الخدمات والعمليات",
                services: "القدرات الأساسية",
                call: "اتصال",
                email: "إيميل",
                meeting: "اجتماع",
                location_pill: "الموقع",
                "svc-consultation": "استشارات",
                "svc-solutions": "حلول الأعمال",
                "svc-operations": "خدمات العمليات",
                "btn-share": "مشاركة الملف",
                "btn-vcard": "حفظ جهة الاتصال",
                "vcard_reminder": "تواصل فوراً. احفظ محمد آصف مباشرة في قائمة جهات الاتصال الخاصة بك.",
                "vcard_save": "حفظ جهة الاتصال",
                "vcard_cancel": "ليس الآن",
                "copied": "تم نسخ الرابط!",
                "status-on": "نشط حالياً (توقيت قطر)",
                "status-off": "🌙 خارج أوقات العمل"
            }
        };

        const langToggleBtn = document.getElementById('lang-toggle');

        function setLanguage(lang) {
            currentLanguage = lang;
            document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.documentElement.setAttribute('lang', lang);
            langToggleBtn.innerText = lang === 'en' ? 'عربي' : 'EN';

            document.getElementById('profile-name').innerText = translations[lang].name;
            document.getElementById('profile-title').innerText = translations[lang].title;
            document.getElementById('meta-location').innerText = translations[lang].location;
            document.getElementById('heading-services').innerText = translations[lang].services_heading;
            document.getElementById('vcard-reminder-text').innerText = translations[lang]["vcard_reminder"];
            document.getElementById('vcard-popup-download').innerText = translations[lang]["vcard_save"];
            document.getElementById('vcard-popup-close').innerText = translations[lang]["vcard_cancel"];

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const translationKey = element.getAttribute('data-i18n');
                if (translations[lang][translationKey]) {
                    const icon = element.querySelector('i');
                    if (icon) {
                        element.innerHTML = '';
                        element.appendChild(icon);
                        element.appendChild(document.createTextNode(' ' + translations[lang][translationKey]));
                    } else {
                        element.innerText = translations[lang][translationKey];
                    }
                }
            });

            updateQatarStatus(); 
        }

        langToggleBtn.addEventListener('click', () => {
            setLanguage(currentLanguage === 'en' ? 'ar' : 'en');
        });


        /* ==========================================================================
           2. QATAR LOCAL TIME ZONE (AST) ACTIVE STATUS ENGINE
           ========================================================================== */
        function updateQatarStatus() {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            
            const now = new Date();
            const qatarTimeString = now.toLocaleString("en-US", {timeZone: "Asia/Qatar", hour: 'numeric', hour12: false});
            const currentQatarHour = parseInt(qatarTimeString, 10);

            if (currentQatarHour >= 8 && currentQatarHour < 18) {
                dot.style.backgroundColor = "#00ffcc";
                dot.classList.add('pulse');
                text.innerText = translations[currentLanguage]["status-on"];
            } else {
                dot.style.backgroundColor = "#ff3b30";
                dot.classList.remove('pulse');
                text.innerText = translations[currentLanguage]["status-off"];
            }
        }
        updateQatarStatus();
        setInterval(updateQatarStatus, 60000);


        /* ==========================================================================
           3. LIGHT / DARK THEME TOGGLE ENGINE
           ========================================================================== */
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = themeToggleBtn.querySelector('i');

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            let targetTheme = 'dark';
            
            if (currentTheme === 'dark') {
                targetTheme = 'light';
                themeIcon.className = 'fa-solid fa-sun';
            } else {
                themeIcon.className = 'fa-solid fa-moon';
            }
            
            document.documentElement.setAttribute('data-theme', targetTheme);
        });


        /* ==========================================================================
           4. 15-SECOND TIMED VCARD POP-UP REMINDER CONTROLLER
           ========================================================================== */
        const modalOverlay = document.getElementById('modal-overlay');
        const closePopupBtn = document.getElementById('vcard-popup-close');
        let hasVcardBeenDownloaded = false;
        
        setTimeout(() => {
            if (!hasVcardBeenDownloaded) {
                modalOverlay.classList.add('visible');
            }
        }, 15000);

        closePopupBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('visible');
        });

        document.getElementById('vcard-popup-download').addEventListener('click', () => {
            modalOverlay.classList.remove('visible');
            document.getElementById('vcard-btn').click(); 
        });


        /* ==========================================================================
           5. INTERACTIONS & SERVICES ACCORDION
           ========================================================================== */
        const trigger = document.getElementById('services-trigger');
        const panel = document.getElementById('services-panel');

        trigger.addEventListener('click', (e) => {
            e.preventDefault();
            trigger.classList.toggle('active');
            if (panel.style.maxHeight && panel.style.maxHeight !== "0px") {
                panel.style.maxHeight = "0px";
            } else {
                panel.style.maxHeight = panel.scrollHeight + "px";
            }
        });

        const shareBtn = document.getElementById('share-profile-btn');
        shareBtn.addEventListener('click', async () => {
            const shareData = {
                title: "Muhammad Asif - Digital Profile",
                text: "Check out the professional digital profile of Muhammad Asif.",
                url: window.location.href
            };

            if (navigator.share) {
                try { await navigator.share(shareData); } catch (err) {}
            } else {
                try {
                    await navigator.clipboard.writeText(window.location.href);
                    const originalText = shareBtn.innerHTML;
                    shareBtn.innerHTML = `<i class="fa-solid fa-check"></i> ${translations[currentLanguage].copied}`;
                    setTimeout(() => { shareBtn.innerHTML = originalText; }, 2500);
                } catch (err) { alert('URL Link copied to clipboard.'); }
            }
        });

        async function triggerVcardDownload() {
            hasVcardBeenDownloaded = true;
            modalOverlay.classList.remove('visible'); 
            
            const imageUrl = window.location.origin + window.location.pathname.replace('index.html', '') + 'Screenshot_20260526_003701_WhatsApp.jpg';
            let base64PhotoText = '';
            
            try {
                const response = await fetch(imageUrl);
                const blob = await response.blob();
                base64PhotoText = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(blob);
                });
            } catch (e) {}

            const vcardLines = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                "N:Asif;Muhammad;;;",
                "FN:Muhammad Asif",
                "TITLE:Business Operations Executive",
                "TEL;TYPE=CELL;TYPE=PREF:+97431697639",
                "EMAIL;TYPE=PREF,INTERNET:asifone77@gmail.com",
                "URL:https://www.abc.com"
            ];
            
            if (base64PhotoText) {
                vcardLines.push("PHOTO;TYPE=JPEG;ENCODING=b:" + base64PhotoText);
            } else {
                vcardLines.push("PHOTO;VALUE=URL:" + imageUrl);
            }
            vcardLines.push("END:VCARD");

            const blobFile = new Blob([vcardLines.join("\r\n")], { type: 'text/vcard;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blobFile);
            link.download = 'Muhammad_Asif.vcf';
            link.click();
        }

        document.getElementById('vcard-btn').addEventListener('click', triggerVcardDownload);
    </script>
</body>
</html>
