<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Asif - Cyber Profile</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #030509;
            --bg-card: rgba(8, 12, 22, 0.75);
            --bg-element: rgba(15, 23, 42, 0.6);
            --bg-element-hover: rgba(0, 243, 255, 0.15);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 243, 255, 0.2);
            --border-hover: rgba(0, 243, 255, 0.7);
            --accent-cyan: #00f3ff;
            --accent-violet: #a855f7;
            --accent-pink: #ec4899;
            --btn-primary: linear-gradient(135deg, #00f3ff 0%, #3b82f6 50%, #a855f7 100%);
            --btn-hover-shadow: rgba(0, 243, 255, 0.5);
            --shadow-wrapper: 0 0 50px rgba(0, 243, 255, 0.12), 0 20px 50px rgba(0, 0, 0, 0.9);
            --overlay-bg: rgba(3, 5, 9, 0.85);
            --modal-bg: rgba(11, 15, 25, 0.95);
        }

        [data-theme="light"] {
            --bg-body: #e2e8f0;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-element: rgba(241, 245, 249, 0.8);
            --bg-element-hover: rgba(2, 132, 199, 0.15);
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: rgba(2, 132, 199, 0.25);
            --border-hover: rgba(2, 132, 199, 0.7);
            --accent-cyan: #0284c7;
            --accent-violet: #7c3aed;
            --accent-pink: #db2777;
            --btn-primary: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #7c3aed 100%);
            --btn-hover-shadow: rgba(2, 132, 199, 0.35);
            --shadow-wrapper: 0 20px 50px rgba(0, 0, 0, 0.12);
            --overlay-bg: rgba(15, 23, 42, 0.6);
            --modal-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Futuristic Overlay Scanline FX */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.6;
        }

        .phone-wrapper {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            border-radius: 32px;
            border: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-wrapper);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow: hidden;
        }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Animated Glowing Edge Sweep */
        .phone-wrapper::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(0, 243, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: sweep 6s infinite linear;
            pointer-events: none;
        }

        @keyframes sweep {
            0% { transform: translateY(-100%) rotate(45deg); }
            100% { transform: translateY(100%) rotate(45deg); }
        }

        /* Controls Header */
        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            z-index: 5;
        }

        .lang-btn {
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(10px);
        }
        .lang-btn:hover { border-color: var(--accent-cyan); background: var(--bg-element-hover); transform: scale(1.05); }

        .theme-btn {
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.95rem;
            backdrop-filter: blur(10px);
        }
        .theme-btn:hover { border-color: var(--accent-cyan); background: var(--bg-element-hover); transform: rotate(15deg) scale(1.05); }

        .profile-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            z-index: 5;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 18px;
        }

        .avatar-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet), var(--accent-pink));
            animation: ringRotate 4s linear infinite;
            filter: blur(4px);
            opacity: 0.8;
        }

        @keyframes ringRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            position: relative;
            z-index: 2;
            border: 2px solid var(--bg-card);
            background-color: var(--bg-element);
        }

        .verified-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: linear-gradient(135deg, var(--accent-cyan), #0066ff);
            color: #000;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 900;
            border: 2px solid var(--bg-card);
            z-index: 3;
            box-shadow: 0 0 10px var(--accent-cyan);
        }
        [dir="rtl"] .verified-badge { right: auto; left: 4px; }

        .profile-hero h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--text-main) 30%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
        }

        .profile-title {
            font-size: 0.92rem;
            color: var(--accent-cyan);
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Quantum Live Status Indicator */
        .status-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-main);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #00ffcc;
        }

        .status-dot.pulse {
            animation: statusPulse 1.8s infinite ease-in-out;
        }

        @keyframes statusPulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.8); }
            70% { box-shadow: 0 0 0 8px rgba(0, 255, 204, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); }
        }

        .meta-location {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .meta-location i { color: var(--accent-cyan); }

        .quick-actions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 28px;
            z-index: 5;
        }

        .action-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-element);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            height: 70px;
            color: var(--text-main);
            text-decoration: none;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .action-pill::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }

        .action-pill:hover::before { left: 100%; }

        .action-pill:hover {
            border-color: var(--accent-cyan);
            background: var(--bg-element-hover);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 8px 20px rgba(0, 243, 255, 0.2);
        }

        .action-pill i {
            font-size: 1.2rem;
            margin-bottom: 6px;
            color: var(--accent-cyan);
            transition: transform 0.2s ease;
        }

        .action-pill:hover i { transform: scale(1.15); }

        .action-pill span {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 5;
        }

        .btn-primary-glow {
            width: 100%;
            height: 52px;
            background: var(--btn-primary);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 6px 25px var(--btn-hover-shadow);
            position: relative;
            overflow: hidden;
        }

        .btn-primary-glow:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 10px 30px var(--btn-hover-shadow);
        }

        .btn-outline-cyber {
            width: 100%;
            height: 52px;
            background: var(--bg-element);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .btn-outline-cyber:hover {
            border-color: var(--accent-cyan);
            background: var(--bg-element-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 243, 255, 0.15);
        }

        /* Holographic Timed Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.visible { opacity: 1; pointer-events: auto; }

        .vcard-popup-card {
            width: 90%;
            max-width: 350px;
            background: var(--modal-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 60px rgba(0, 243, 255, 0.2);
            border-radius: 28px;
            padding: 26px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .modal-overlay.visible .vcard-popup-card { transform: scale(1); }

        .vcard-popup-icon {
            width: 60px;
            height: 60px;
            background: rgba(0, 243, 255, 0.1);
            color: var(--accent-cyan);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        .vcard-popup-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
            font-weight: 500;
            margin-bottom: 24px;
        }

        .modal-btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        @media (max-width: 480px) {
            body { padding: 0; background-color: var(--bg-body); }
            .phone-wrapper { border-radius: 0; border: none; min-height: 100vh; box-shadow: none; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Particle Background -->
    <canvas id="particle-canvas"></canvas>

    <div class="phone-wrapper">
        
        <!-- Header Controls -->
        <div class="controls-header">
            <button id="lang-toggle" class="lang-btn" aria-label="Switch Language">
                <i class="fa-solid fa-language"></i> <span id="lang-text">عربي</span>
            </button>
            <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
        
        <!-- Hero Section -->
        <section class="profile-hero">
            <div class="avatar-container">
                <div class="avatar-ring"></div>
                <img id="profile-display-img" src="Screenshot_20260526_003701_WhatsApp.jpg" alt="Muhammad Asif" onerror="this.src='https://placehold.co/200x200/0f172a/00f3ff?text=MA'">
                <div class="verified-badge"><i class="fa-solid fa-check"></i></div>
            </div>
            
            <div id="status-badge" class="status-container">
                <span id="status-dot" class="status-dot pulse"></span>
                <span id="status-text">Checking Status...</span>
            </div>

            <h1 id="profile-name">Muhammad Asif</h1>
            <p id="profile-title" class="profile-title">Digital Profile</p>
            
            <div class="meta-location">
                <i class="fa-solid fa-location-dot"></i> <span id="meta-location-text">Doha, Qatar</span>
            </div>
        </section>

        <!-- Quick Actions Row -->
        <section class="quick-actions-grid">
            <a href="tel:+97431697639" class="action-pill" aria-label="Call">
                <i class="fa-solid fa-phone"></i>
                <span data-i18n="call">Call</span>
            </a>
            <a href="https://wa.me/97431697639" target="_blank" class="action-pill" aria-label="WhatsApp">
                <i class="fa-brands fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>
            <a href="mailto:asifone77@gmail.com" class="action-pill" aria-label="Email">
                <i class="fa-regular fa-envelope"></i>
                <span data-i18n="email">Email</span>
            </a>
            <a href="https://wa.me/97431697639?text=Hello%20Muhammad,%20I%20would%20like%20to%20schedule%20a%20meeting." target="_blank" class="action-pill" aria-label="Meeting">
                <i class="fa-regular fa-calendar-days"></i>
                <span data-i18n="meeting">Meeting</span>
            </a>
            <a href="https://maps.google.com/?q=Doha,+Qatar" target="_blank" class="action-pill" aria-label="Location">
                <i class="fa-solid fa-location-arrow"></i>
                <span data-i18n="location_pill">Location</span>
            </a>
        </section>

        <!-- CTAs -->
        <section class="cta-container">
            <button id="share-profile-btn" class="btn-primary-glow">
                <i class="fa-solid fa-share-nodes"></i> <span data-i18n="btn-share">Share Profile</span>
            </button>
            <button id="vcard-btn" class="btn-outline-cyber">
                <i class="fa-regular fa-address-card"></i> <span id="vcard-btn-text" data-i18n="btn-vcard">Download vCard</span>
            </button>
        </section>

    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="vcard-popup-card">
            <div class="vcard-popup-icon"><i class="fa-regular fa-address-book"></i></div>
            <div id="vcard-reminder-text" class="vcard-popup-text">
                Connect instantly. Save Muhammad Asif directly to your contact list.
            </div>
            <div class="modal-btn-group">
                <button id="vcard-popup-download" class="btn-primary-glow" style="height:46px; font-size:0.9rem;">Save Contact</button>
                <button id="vcard-popup-close" class="btn-outline-cyber" style="height:40px; font-size:0.85rem; border:none;">Not Now</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 243, 255, ${this.alpha})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f3ff';
                ctx.fill();
            }
        }

        for (let i = 0; i < 45; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        let currentLanguage = 'en';
        
        const translations = {
            en: {
                name: "Muhammad Asif",
                title: "Digital Profile",
                location: "Doha, Qatar",
                call: "Call",
                email: "Email",
                meeting: "Meeting",
                location_pill: "Location",
                "btn-share": "Share Profile",
                "btn-vcard": "Download vCard",
                "vcard_reminder": "Connect instantly. Save Muhammad Asif directly to your contact list.",
                "vcard_save": "Save Contact",
                "vcard_cancel": "Not Now",
                "copied": "Link Copied!",
                "status-on": "Active Now (Qatar Time)",
                "status-off": "Offline / Standby"
            },
            ar: {
                name: "محمد آصف",
                title: "الملف الرقمي",
                location: "الدوحة، قطر",
                call: "اتصال",
                email: "إيميل",
                meeting: "اجتماع",
                location_pill: "الموقع",
                "btn-share": "مشاركة الملف",
                "btn-vcard": "حفظ جهة الاتصال",
                "vcard_reminder": "تواصل فوراً. احفظ محمد آصف مباشرة في قائمة جهات الاتصال الخاصة بك.",
                "vcard_save": "حفظ جهة الاتصال",
                "vcard_cancel": "ليس الآن",
                "copied": "تم نسخ الرابط!",
                "status-on": "نشط حالياً (توقيت قطر)",
                "status-off": "خارج أوقات العمل"
            }
        };

        const langToggleBtn = document.getElementById('lang-toggle');
        const langText = document.getElementById('lang-text');

        function setLanguage(lang) {
            currentLanguage = lang;
            document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.documentElement.setAttribute('lang', lang);
            langText.innerText = lang === 'en' ? 'عربي' : 'EN';

            document.getElementById('profile-name').innerText = translations[lang].name;
            document.getElementById('profile-title').innerText = translations[lang].title;
            document.getElementById('meta-location-text').innerText = translations[lang].location;
            document.getElementById('vcard-reminder-text').innerText = translations[lang]["vcard_reminder"];
            document.getElementById('vcard-popup-download').innerText = translations[lang]["vcard_save"];
            document.getElementById('vcard-popup-close').innerText = translations[lang]["vcard_cancel"];

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    element.innerText = translations[lang][key];
                }
            });

            updateQatarStatus(); 
        }

        langToggleBtn.addEventListener('click', () => {
            setLanguage(currentLanguage === 'en' ? 'ar' : 'en');
        });

        function updateQatarStatus() {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            
            const now = new Date();
            const qatarTimeString = now.toLocaleString("en-US", {timeZone: "Asia/Qatar", hour: 'numeric', hour12: false});
            const currentQatarHour = parseInt(qatarTimeString, 10);

            if (currentQatarHour >= 8 && currentQatarHour < 18) {
                dot.style.backgroundColor = "#00ffcc";
                dot.classList.add('pulse');
                text.innerText = translations[currentLanguage]["status-on"];
            } else {
                dot.style.backgroundColor = "#ff3b30";
                dot.classList.remove('pulse');
                text.innerText = translations[currentLanguage]["status-off"];
            }
        }
        updateQatarStatus();
        setInterval(updateQatarStatus, 60000);

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = themeToggleBtn.querySelector('i');

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            let targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
            themeIcon.className = targetTheme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
            document.documentElement.setAttribute('data-theme', targetTheme);
        });

        const modalOverlay = document.getElementById('modal-overlay');
        const closePopupBtn = document.getElementById('vcard-popup-close');
        let hasVcardBeenDownloaded = false;
        
        setTimeout(() => {
            if (!hasVcardBeenDownloaded) {
                modalOverlay.classList.add('visible');
            }
        }, 15000);

        closePopupBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('visible');
        });

        document.getElementById('vcard-popup-download').addEventListener('click', () => {
            modalOverlay.classList.remove('visible');
            triggerVcardDownload(); 
        });

        const shareBtn = document.getElementById('share-profile-btn');
        shareBtn.addEventListener('click', async () => {
            const shareData = {
                title: "Muhammad Asif - Digital Profile",
                text: "Connect with Muhammad Asif.",
                url: window.location.href
            };

            if (navigator.share) {
                try { await navigator.share(shareData); } catch (err) {}
            } else {
                try {
                    await navigator.clipboard.writeText(window.location.href);
                    const originalText = shareBtn.innerHTML;
                    shareBtn.innerHTML = `<i class="fa-solid fa-check"></i> ${translations[currentLanguage].copied}`;
                    setTimeout(() => { shareBtn.innerHTML = originalText; }, 2500);
                } catch (err) {
                    alert('Profile URL copied to clipboard.');
                }
            }
        });

        async function triggerVcardDownload() {
            hasVcardBeenDownloaded = true;
            modalOverlay.classList.remove('visible'); 
            
            const imageUrl = 'Screenshot_20260526_003701_WhatsApp.jpg';
            let base64PhotoText = '';
            
            try {
                const response = await fetch(imageUrl);
                const blob = await response.blob();
                base64PhotoText = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(blob);
                });
            } catch (e) {}

            const vcardLines = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                "N:Asif;Muhammad;;;",
                "FN:Muhammad Asif",
                "TEL;TYPE=CELL;TYPE=PREF:+97431697639",
                "EMAIL;TYPE=PREF,INTERNET:asifone77@gmail.com"
            ];
            
            if (base64PhotoText) {
                vcardLines.push("PHOTO;TYPE=JPEG;ENCODING=b:" + base64PhotoText);
            }

            vcardLines.push("END:VCARD");

            const blobFile = new Blob([vcardLines.join("\r\n")], { type: 'text/vcard;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blobFile);
            link.download = 'Muhammad_Asif.vcf';
            link.click();
        }

        document.getElementById('vcard-btn').addEventListener('click', triggerVcardDownload);
    </script>
</body>
</html>
